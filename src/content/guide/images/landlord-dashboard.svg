  <line x1="56" y1="378" x2="1112" y2="378" stroke="#DCD5C8"/>

  <!-- row 1 -->
  <text x="56" y="410" fill="#1B2421" font-size="14" font-weight="600">Sunrise Apartments — A3</text>
