  <text x="980" y="460" fill="#1B2421" font-size="14">KES 18,500</text>
  <line x1="56" y1="478" x2="1112" y2="478" stroke="#F3F4F6"/>

  <!-- row 3 -->
  <text x="56" y="510" fill="#1B2421" font-size="14" font-weight="600">Kileleshwa Court — B4</text>
  <text x="420" y="510" fill="#1B2421" font-size="14">8</text>
  <text x="560" y="510" fill="#1B2421" font-size="14">Grace Achieng</text>
  <rect x="800" y="494" width="68" height="22" rx="11" fill="#FBEAE9"/>
  <text x="812" y="510" fill="#B3261E" font-size="12" font-weight="600">Overdue</text>
  <text x="980" y="510" fill="#1B2421" font-size="14">KES 12,000</text>
  <line x1="56" y1="528" x2="1112" y2="528" stroke="#F3F4F6"/>

  <!-- row 4 -->
  <text x="56" y="560" fill="#1B2421" font-size="14" font-weight="600">Riverside Court — C2</text>
  <text x="420" y="560" fill="#1B2421" font-size="14">6</text>
  <text x="560" y="560" fill="#1B2421" font-size="14">Peter Kimani</text>
  <rect x="800" y="544" width="60" height="22" rx="11" fill="#EAF4E8"/>
  <text x="812" y="560" fill="#2E7D32" font-size="12" font-weight="600">Paid</text>
  <text x="980" y="560" fill="#1B2421" font-size="14">KES 30,000</text>

  <rect x="56" y="612" width="180" height="40" rx="8" fill="#C1622D"/>
  <text x="146" y="637" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">+ Add manager</text>
  <rect x="252" y="612" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#0F3D3E"/>
  <text x="342" y="637" fill="#0F3D3E" font-size="13" font-weight="600" text-anchor="middle">Download report</text>

  <text x="1112" y="708" fill="#B0A996" font-size="11" text-anchor="end">Illustrative preview — fictional data</text>
