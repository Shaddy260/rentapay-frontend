<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="1200" height="720" fill="#FAF7F2"/>
  <!-- top bar -->
  <rect width="1200" height="64" fill="#0F3D3E"/>
  <text x="32" y="40" fill="#FFFFFF" font-size="22" font-weight="700" font-family="Fraunces, Georgia, serif">RentaPay</text>
  <text x="150" y="40" fill="#E8A574" font-size="13" font-weight="600" letter-spacing="1">LANDLORD</text>
  <circle cx="1140" cy="32" r="16" fill="#1A5C5D"/>
