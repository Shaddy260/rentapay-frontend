  <!-- row 2 -->
  <text x="56" y="460" fill="#1B2421" font-size="14" font-weight="600">Kileleshwa Court — B1</text>
  <text x="420" y="460" fill="#1B2421" font-size="14">8</text>
  <text x="560" y="460" fill="#1B2421" font-size="14">Brian Otieno</text>
  <rect x="800" y="444" width="72" height="22" rx="11" fill="#FFF4E5"/>
