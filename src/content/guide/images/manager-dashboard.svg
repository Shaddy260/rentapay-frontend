<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <rect width="1200" height="720" fill="#FAF7F2"/>
  <rect width="1200" height="64" fill="#0F3D3E"/>
  <text x="32" y="40" fill="#FFFFFF" font-size="22" font-weight="700" font-family="Fraunces, Georgia, serif">RentaPay</text>
  <text x="150" y="40" fill="#E8A574" font-size="13" font-weight="600" letter-spacing="1">CARETAKER</text>
  <circle cx="1140" cy="32" r="16" fill="#1A5C5D"/>
  <text x="1140" y="37" fill="#fff" font-size="13" text-anchor="middle">MK</text>

  <text x="32" y="108" fill="#1B2421" font-size="26" font-weight="700" font-family="Fraunces, Georgia, serif">Kileleshwa Court</text>
  <text x="32" y="134" fill="#5C6663" font-size="14">You manage 8 units at this property</text>

  <!-- record payment card -->
  <rect x="32" y="164" width="500" height="230" rx="10" fill="#FFFFFF" stroke="#DCD5C8"/>
  <text x="56" y="196" fill="#1B2421" font-size="16" font-weight="700">Record a manual payment</text>

  <text x="56" y="230" fill="#5C6663" font-size="12">Tenant</text>
  <rect x="56" y="238" width="440" height="36" rx="6" fill="#F7F4EC" stroke="#DCD5C8"/>
  <text x="68" y="261" fill="#1B2421" font-size="13">Brian Otieno — Unit B1</text>

  <text x="56" y="292" fill="#5C6663" font-size="12">Amount (KES)</text>
  <rect x="56" y="300" width="210" height="36" rx="6" fill="#F7F4EC" stroke="#DCD5C8"/>
  <text x="68" y="323" fill="#1B2421" font-size="13">18,500</text>

  <text x="286" y="292" fill="#5C6663" font-size="12">Method</text>
  <rect x="286" y="300" width="210" height="36" rx="6" fill="#F7F4EC" stroke="#DCD5C8"/>
  <text x="298" y="323" fill="#1B2421" font-size="13">Cash</text>

  <rect x="56" y="352" width="200" height="38" rx="8" fill="#C1622D"/>
  <text x="156" y="376" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Save payment</text>

  <!-- tenant list card -->
  <rect x="556" y="164" width="612" height="512" rx="10" fill="#FFFFFF" stroke="#DCD5C8"/>
  <text x="580" y="196" fill="#1B2421" font-size="16" font-weight="700">Tenants — Kileleshwa Court</text>

  <g font-size="13" fill="#5C6663">
    <text x="580" y="228">TENANT</text>
    <text x="800" y="228">UNIT</text>
    <text x="900" y="228">STATUS</text>
  </g>
  <line x1="580" y1="240" x2="1140" y2="240" stroke="#DCD5C8"/>

  <text x="580" y="272" fill="#1B2421" font-size="14">Brian Otieno</text>
  <text x="800" y="272" fill="#1B2421" font-size="14">B1</text>
  <rect x="900" y="256" width="72" height="22" rx="11" fill="#FFF4E5"/>
  <text x="912" y="272" fill="#B8860B" font-size="12" font-weight="600">Pending</text>
  <line x1="580" y1="290" x2="1140" y2="290" stroke="#F3F4F6"/>

  <text x="580" y="322" fill="#1B2421" font-size="14">Grace Achieng</text>
  <text x="800" y="322" fill="#1B2421" font-size="14">B4</text>
  <rect x="900" y="306" width="68" height="22" rx="11" fill="#FBEAE9"/>
  <text x="912" y="322" fill="#B3261E" font-size="12" font-weight="600">Overdue</text>
  <line x1="580" y1="340" x2="1140" y2="340" stroke="#F3F4F6"/>

  <text x="580" y="372" fill="#1B2421" font-size="14">Samuel Kariuki</text>
  <text x="800" y="372" fill="#1B2421" font-size="14">B2</text>
  <rect x="900" y="356" width="60" height="22" rx="11" fill="#EAF4E8"/>
  <text x="912" y="372" fill="#2E7D32" font-size="12" font-weight="600">Paid</text>
  <line x1="580" y1="390" x2="1140" y2="390" stroke="#F3F4F6"/>

  <text x="580" y="422" fill="#1B2421" font-size="14">Fatuma Ali</text>
  <text x="800" y="422" fill="#1B2421" font-size="14">B5</text>
  <rect x="900" y="406" width="60" height="22" rx="11" fill="#EAF4E8"/>
  <text x="912" y="422" fill="#2E7D32" font-size="12" font-weight="600">Paid</text>

  <text x="580" y="470" fill="#5C6663" font-size="12">You can record payments and view tenant details.</text>
  <text x="580" y="488" fill="#5C6663" font-size="12">Commission and payout figures are only visible to the landlord.</text>

  <text x="1140" y="708" fill="#B0A996" font-size="11" text-anchor="end">Illustrative preview — fictional data</text>
